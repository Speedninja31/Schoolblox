<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SchoolBlox</title>
<link rel="stylesheet" href="css/style.css" onerror="(window.__fail=window.__fail||[]).push('css/style.css')">
</head>
<body>
<div id="sbx">
<header id="nav"><a class="brand" id="brand"><svg class="lgo" viewBox="0 0 40 40" width="30" height="30"><g transform="rotate(-12 20 20)"><rect x="6" y="6" width="28" height="28" rx="6" fill="#ff8a00" stroke="#fff" stroke-width="2.5"/><text x="20" y="28" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="21" fill="#fff">S</text></g></svg><span class="b1">School</span><span class="b2">Blox</span></a>
<nav class="links"><button data-go="games">Games</button><button data-go="catalog">Catalog</button><button data-go="friends">Friends</button><button data-go="settings">Settings</button></nav>
<div class="srch"><input id="q" placeholder="Search" autocomplete="off"><span>🔎</span></div>
<div class="curs"><span class="cc" title="Pet Hatchery coins">🪙 <b id="cc1">0</b></span><span class="cc" title="Gems">💎 <b id="cc2">0</b></span><button id="gear" title="Settings">⚙️</button></div></header>
<aside id="sbside"><div class="uname" id="uname">Player</div>
<nav><button data-nav="home">🏠<span>Home</span></button><button data-nav="games">🕹️<span>Games</span></button><button data-nav="friends">👥<span>Friends</span><i id="fbadge"></i></button><button data-nav="avatar">🧢<span>Character</span></button><button data-nav="favorites">♥<span>Favorites</span></button><button data-nav="recent">⏱<span>Recent</span></button><button data-nav="settings">⚙️<span>Settings</span></button></nav>
<button id="inv" class="upg">🔗 Invite Friends</button></aside>
<main id="sbmain"><div id="ban"></div>
<div id="prof"><div class="pav" id="pav"></div><div class="pgr"><h1>Hello, <span id="hn">Player</span>!</h1><div class="pin"><label>Your name<input id="nick" placeholder="Your name" maxlength="14"></label><label>Room code<input id="roomcode" placeholder="Room" maxlength="20" value="public"></label><span id="online"></span></div></div></div>
<section id="frs"></section><div id="rows"></div>
<footer>SchoolBlox · Made with Three.js · Multiplayer by Supabase · Not affiliated with Roblox</footer></main>
<button id="frb" class="chatab">👥 Friends</button></div>
<div id="gd"></div>
<div id="sp"><div class="frh"><b>⚙️ Settings</b><button id="spx2">✕</button></div>
<label class="set"><span>Mouse sensitivity <b id="sensv"></b></span><input type="range" id="sens" min="1" max="10"></label>
<label class="set"><span>Graphics</span><select id="qual"><option value="auto">Auto</option><option value="low">Low (faster)</option><option value="high">High (sharper)</option></select></label>
<label class="set"><span>Theme</span><select id="thm"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
<label class="set"><span>Sound</span><button id="snb">🔊 On</button></label>
<button id="rst" class="dng">Reset all saved data</button></div>

<div id="frp"><div class="frh"><b>👥 Friends</b><button id="frx">✕</button></div>
<div>Your friend code<div class="frc"><code id="myc"></code><button id="cpc">Copy link</button></div></div>
<div class="fra"><input id="addc" placeholder="Add a friend by code" maxlength="8"><button id="addb">Add</button></div>
<div id="frl"></div><small id="frn" style="color:var(--sub)"></small></div><div id="toasts"></div>
<div id="modal"><div class="win">
<div class="bar"><b id="gtitle"></b><span id="score"></span><span><button id="hlp" title="Controls">❔</button><button id="frb2" title="Friends">👥</button><button id="mt" title="Sound">🔊</button><button id="fs" title="Fullscreen">⛶</button><button id="close">Exit</button></span></div>
<div id="view"><div id="over"></div><div id="banner"></div><div id="lobby"><div class="lbx"><div class="lba" id="lba"></div><div class="lbc2"><h2 id="lbt"></h2><div class="lbtg" id="lbtg"></div><p class="lbh" id="lbh"></p><div class="lbr"><span id="lbc"></span><button class="lbs" id="lbcp">🔗 Copy invite</button></div><div id="lbl"></div><div class="lbb"><button class="lbs" id="lbback">← Back</button><button class="btn" id="lbgo">▶ Play</button></div></div></div></div><button id="emb">😀 Emotes</button><div id="emp"></div><div id="clog"></div><div id="hp"><div id="hpf"></div><span id="hpt"></span></div><div id="hurt"></div><div id="vote"></div><div id="role"><b id="rt"></b><i id="rcd"></i></div><div id="rev"></div><div id="xh"></div><div id="hm">✕</div><div id="lockmsg">🖱 Click to lock your mouse (Esc releases it)</div><div id="spec"><button id="spt">👁 Spectate</button><span id="spc" style="display:none"><button id="spp">◀</button> <b id="spn"></b> <button id="spx">▶</button></span></div><input id="chatin" placeholder="Press Enter to chat" maxlength="80"></div>
<div id="petview" style="display:none"></div><div id="custom"></div>
<div class="touch" id="touch"><button data-k="KeyA">◀</button><button data-k="KeyW">▲</button><button data-k="KeyS">▼</button><button data-k="KeyD">▶</button><button data-k="Space">JUMP</button><span id="mmb" style="display:none"><button data-k="KeyE">ACT</button><button data-k="KeyF">THROW</button></span></div>
<div class="hint" id="hint"></div>
</div></div>



<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.js"></script>
<script src="js/config.js" onerror="(window.__fail=window.__fail||[]).push('js/config.js')"></script>
<script src="js/core.js" onerror="(window.__fail=window.__fail||[]).push('js/core.js')"></script>
<script src="js/games/avatar.js" onerror="(window.__fail=window.__fail||[]).push('js/games/avatar.js')"></script>
<script src="js/games/tower.js" onerror="(window.__fail=window.__fail||[]).push('js/games/tower.js')"></script>
<script src="js/games/survive.js" onerror="(window.__fail=window.__fail||[]).push('js/games/survive.js')"></script>
<script src="js/games/pets.js" onerror="(window.__fail=window.__fail||[]).push('js/games/pets.js')"></script>
<script src="js/games/mm.js" onerror="(window.__fail=window.__fail||[]).push('js/games/mm.js')"></script>
<script src="js/games/hang.js" onerror="(window.__fail=window.__fail||[]).push('js/games/hang.js')"></script>
<script src="js/games/fish.js" onerror="(window.__fail=window.__fail||[]).push('js/games/fish.js')"></script>
<script src="js/games/garden.js" onerror="(window.__fail=window.__fail||[]).push('js/games/garden.js')"></script>
<script src="js/games/zom.js" onerror="(window.__fail=window.__fail||[]).push('js/games/zom.js')"></script>
<script src="js/games/snow.js" onerror="(window.__fail=window.__fail||[]).push('js/games/snow.js')"></script>
<script src="js/games/coming-soon.js" onerror="(window.__fail=window.__fail||[]).push('js/games/coming-soon.js')"></script>
<script src="js/menu.js" onerror="(window.__fail=window.__fail||[]).push('js/menu.js')"></script>
<script>
/* If any file failed to load (wrong folder, missing upload, old deploy), show exactly which one. */
(function(){var f=window.__fail||[],n=(typeof GAMES==='undefined')?0:GAMES.length;
 if(!f.length&&n>=10)return;
 var d=document.createElement('div');d.style.cssText='position:fixed;left:0;right:0;top:0;background:#b71c1c;color:#fff;padding:12px 16px;z-index:99999;font:14px/1.5 system-ui;white-space:pre-line';
 d.textContent='Some site files did not load, so the menu cannot start.\n'+(f.length?'Missing: '+f.join(', '):'Only '+n+' of 11 games were found.')+'\nCheck that these files are in your repository in the same folders (css/, js/, js/games/), wait for Netlify to finish deploying, then hard refresh (Ctrl+Shift+R).';
 document.body.appendChild(d)})();
</script>
</body>
</html>
